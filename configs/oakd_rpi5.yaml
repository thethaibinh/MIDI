# MIDI Configuration for Ardupilot/MAVROS
# Runtime mode
runtime_mode: "mavros"
collision_checking_method: "midi"  # MUST be "midi" - PYRAMID method removed (required CUDA)
visualise: no
world_frame_name: "map"
vehicle_frame_name: "base_link"

# Topics - OAK-D stereo depth output
topics:
  depth: "/oak/stereo/image_raw"

# Goal coordinates (relative to takeoff position in ENU)
goal_coordinate:
  north: 5.0   # North (meters in ENU Y direction)
  west: 0.0     # West (negative means East, meters in ENU X direction)
  up: 1.0       # Up (meters in ENU Z direction)

# Depth camera parameters - OAK-D Pro W with 4x decimation
# Native: 1280x720 (720P default), after 4x decimation: 320x180
# Intrinsics from /oak/stereo/camera_info topic
depth_camera:
  depth_scale: 0.001  # OAK-D outputs 16UC1 in millimeters
  decimation_factor: 1  # Already decimated by camera (4x on VPU)
  focal_length: 142.71  # fx from camera_info K matrix
  cx: 159.87            # Principal point x from camera_info
  cy: 86.78             # Principal point y from camera_info
  depth_uncertainty:
    ca0: 0.001
    ca1: 0.0007
    ca2: 0.005
    cl0: 0.0
    cl1: 0.0005
    cl2: 0.0013

# Planning parameters
planning_cycle_time: 0.05           # Planning frequency (20 Hz)
checking_time_ratio: 0.9
acc_planning_threshold: 0.1
vel_planning_threshold: 0.4          # Lateral and vertical velocity threshold (m/s)

# Data freshness thresholds (seconds) - reject stale data for planning safety
depth_age_threshold: 0.12            # Max age of depth image (wall clock) before rejection
state_age_threshold: 0.05           # Max age of state estimate (sim time) before rejection
transform_age_threshold: 0.05        # Max age of TF transforms (sim time) before rejection
sampled_trajectories_threshold: 8000
checked_trajectories_threshold: 100
3d_planning: no                     # Use 2D planning (safer for initial testing)
2d_z_margin: 0.5
traveling_cost: "distance"          # "direction" or "distance"
replan_factor: 2.0
debug_num_trajectories: no
collision_probability_threshold: 5
openmp_chunk_size: 16

# Collision checking parameters (adjust based on your drone size)
true_vehicle_radius: 0.33           # Actual radius including propellers (m)
planning_vehicle_radius: 0.48       # Safety margin for planning (m)
minimum_clear_distance: 0.8         # Min clearance from obstacles (m)

# Fence/world limits (keep drone within safe bounds)
fence_limits:
  min_x: -3.5
  max_x: 3.5  # East is positive X in ENU
  min_y: -1.0  
  max_y: 7.5  # North is positive Y in ENU
  min_z: 0.4
  max_z: 2.5  # Up is positive Z in ENU

# SSTO trajectory generation parameters
# Sampling parameters
depth_upper_bound: 2.5              # Max depth to plan ahead (m)
depth_lower_bound: 1.0              # Min depth to plan ahead (m)
depth_sampling_margin: 0.7
is_spiral_sampling: no
spiral_sampling_step: 3

# Kinematic constraints (adjust based on your drone capabilities)
max_velocity_x: 1.0                 # Forward velocity (m/s)
max_velocity_y: 0.5                 # Lateral velocity (m/s)
max_velocity_z: 1.0                 # Vertical velocity (m/s)
max_acceleration_x: 2.0             # Forward acceleration (m/s²)
max_acceleration_y: 1.0             # Lateral acceleration (m/s²)
max_acceleration_z: 2.0             # Vertical acceleration (m/s²)

# Control parameters
trajectory_discretisation_cycle: 0.01  # Control update rate (100 Hz)
go_to_goal_threshold: 0.3              # Distance to switch to goal mode (m)
mavros_control_mode: "kinematic"       # "kinematic" or "attitude"
setpoint_type: "position"            # "position" or "full" control mode, "full" includes velocity and acceleration feedforward

# MIDI Configuration for OmniDrones Simulation
# Runtime mode
runtime_mode: "omnidrones"
collision_checking_method: "midi"  # MUST be "midi" - PYRAMID method removed (required CUDA)
visualise: yes
world_frame_name: "map"
vehicle_frame_name: "base_link"  # MIDI publishes TF internally from odometry

# Topics
topics:
  depth: "camera/depth/image_raw"

# Goal coordinates (NWU world frame with FLU body frame)
# Environment is rotated so obstacles face the drone
# NWU: X=North(forward), Y=West(left), Z=Up
# Drone body FLU aligns with world NWU at yaw=0
goal_coordinate:
  north: 100.0   # Forward distance (meters, X in NWU)
  west: 0.0     # Left distance (meters, Y in NWU)
  up: 3.0       # Altitude (meters, Z in NWU)

# Depth camera parameters - OAK-D Pro Wide (simulated in OmniDrones)
# Native: 1280x800, HFOV 127°, VFOV 79.5°
# Simulated: 320x200 (4x decimation)
#
# Isaac Sim camera intrinsics:
#   fx = (width/2) / tan(HFOV/2) = 160 / tan(63.5°) = 79.45 pixels
#
depth_camera:
  depth_scale: 1.0  # OmniDrones publishes 32FC1 in meters
  decimation_factor: 1  # Already decimated in OmniDrones
  focal_length: 79.45   # fx = 160 / tan(63.5°) (matches OmniDrones 320x200)
  cx: 160.0             # Principal point x (image center x = width/2)
  cy: 100.0             # Principal point y (image center y = height/2)
  depth_uncertainty:
    ca0: 0.001
    ca1: 0.0007
    ca2: 0.005
    cl0: 0.0
    cl1: 0.0005
    cl2: 0.0013

# Planning parameters
planning_cycle_time: 0.05           # Planning frequency (20 Hz)
checking_time_ratio: 0.9
acc_planning_threshold: 0.1
vel_planning_threshold: 0.4          # New: Lateral and vertical velocity threshold (m/s)
depth_age_threshold: 0.05                 # Max age of depth image (s) before rejection (relaxed for sim)
state_age_threshold: 0.05                 # Max age of state estimate (s) before rejection
transform_age_threshold: 0.05             # Max age of TF transforms (s) before rejection
sampled_trajectories_threshold: 20000    # Lowered for OmniDrones simulation
checked_trajectories_threshold: 200    # Lowered - accept trajectory once we have 3 checked
3d_planning: yes                 # Use 3D planning
2d_z_margin: 0.2
traveling_cost: "direction"          # "direction" or "distance"
replan_factor: 3.0
debug_num_trajectories: no
collision_probability_threshold: 5
openmp_chunk_size: 64              # Optimized: 320x200/12threads ≈ 5333 pixels, chunk=64 for good load balance

# Collision checking parameters (adjust based on your drone size)
true_vehicle_radius: 0.18           # Actual radius including propellers (m)
planning_vehicle_radius: 0.4       # Safety margin for planning (m)
minimum_clear_distance: 0.5         # Min clearance from obstacles (m)

# Fence/world limits (keep drone within safe bounds)
fence_limits:
  min_x: -1000.0
  max_x: 1000.0
  min_y: -1000.0
  max_y: 1000.0
  min_z: -1000.0
  max_z: 1000.0

# SSTO trajectory generation parameters
depth_upper_bound: 3.0              # Max depth to plan ahead (m)
depth_lower_bound: 0.7              # Min depth to plan ahead (m)
depth_sampling_margin: 0.7
is_spiral_sampling: yes
spiral_sampling_step: 3

# Kinematic constraints (adjust based on drone capabilities)
# max_velocity_x: 2.0                 # Forward velocity (m/s)
# max_velocity_y: 1.0                 # Lateral velocity (m/s)
# max_velocity_z: 1.0                 # Vertical velocity (m/s)
# max_acceleration_x: 2.0             # Forward acceleration (m/s²)
# max_acceleration_y: 1.0             # Lateral acceleration (m/s²)
# max_acceleration_z: 1.0             # Vertical acceleration (m/s²)

max_velocity_x: 2.0
max_velocity_y: 1.5
max_velocity_z: 2.0
max_acceleration_x: 6.0
max_acceleration_y: 3.0
max_acceleration_z: 6.0

# Control parameters
trajectory_discretisation_cycle: 0.01  # Control update rate (100 Hz)
go_to_goal_threshold: 1.5              # Distance to switch to goal mode (m)
mavros_control_mode: "kinematic"       # Not used in OmniDrones mode
setpoint_type: "full"            # "position" or "full" control mode, "full" includes velocity and acceleration feedforward

# Frontier-Led Swarm Exploration defaults
# These can be overridden at runtime via /swarm_params topic from ground GUI
swarm:
  # num_drones: 3
  # w_cohesion: 0.8         # Pull toward swarm centroid
  # w_separation: 1.5       # Push away from nearby drones
  # w_alignment: 0.5        # Match neighbor heading
  # w_frontier: 1.2         # Attraction toward nearest frontier
  # w_obstacle: 2.0         # Repulsion from obstacles (via MIDI depth)
  # separation_radius: 3.0  # Min distance between drones (m)
  # neighbor_radius: 10.0   # Radius to consider neighbors (m)
  # max_swarm_speed: 1.5    # Max velocity during swarm exploration (m/s)
  # altitude: 1.5           # Exploration altitude (m)
  # cell_size: 0.5          # Occupancy grid cell size (m)
  # map_width: 60.0         # Map width (m)
  # map_height: 60.0        # Map height (m)
  num_drones: 15
  w_cohesion: 0.1         # Pull toward swarm centroid
  w_separation: 0.2       # Push away from nearby drones
  w_alignment: 0.0        # Match neighbor heading
  w_frontier: 1.0         # Attraction toward nearest frontier
  w_obstacle: 0.2         # Repulsion from obstacles (via MIDI depth)
  separation_radius: 5.0  # Min distance between drones (m)
  neighbor_radius: 20.0   # Radius to consider neighbors (m)
  max_swarm_speed: 2.0    # Max velocity during swarm exploration (m/s)
  altitude: 15.0           # Exploration altitude (m)
  cell_size: 5.0          # Occupancy grid cell size (m)
  map_width: 100.0         # Map width (m)
  map_height: 100.0        # Map height (m)
  sensor_range: 20.0       # Observation radius (m) — downward-camera disc footprint

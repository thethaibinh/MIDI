# MIDI Configuration for OmniDrones Simulation
# Runtime mode
runtime_mode: "omnidrones"
collision_checking_method: "midi"  # MUST be "midi" - PYRAMID method removed (required CUDA)
visualise: yes
world_frame_name: "map"
vehicle_frame_name: "base_link"  # MIDI publishes TF internally from odometry

# Topics
topics:
  depth: "camera/depth/image_raw"

# Goal coordinates (NWU world frame with FLU body frame)
# Environment is rotated so obstacles face the drone
# NWU: X=North(forward), Y=West(left), Z=Up
# Drone body FLU aligns with world NWU at yaw=0
goal_coordinate:
  north: 20.0   # Forward distance (meters, maps to +X in NWU)
  west: 0.0     # Left distance (meters, maps to +Y in NWU)
  up: 3.0       # Altitude (meters, maps to +Z in NWU)

# Depth camera parameters - OAK-D Pro Wide (simulated in OmniDrones)
# Native: 1280x800, HFOV 127°, VFOV 79.5°
# Simulated: 640x400 (2x decimation)
#
# Isaac Sim camera intrinsics:
#   fx = focal_length_mm * width / horizontal_aperture_mm
#   fx = 24 * 640 / 96.7 = 158.8 pixels
#
depth_camera:
  depth_scale: 1.0  # OmniDrones publishes 32FC1 in meters
  decimation_factor: 1  # Already decimated in OmniDrones
  focal_length: 158.8   # fx = 24mm * 640px / 96.7mm (matches OmniDrones simulation)
  cx: 320.0             # Principal point x (image center x = width/2)
  cy: 200.0             # Principal point y (image center y = height/2)
  depth_uncertainty:
    ca0: 0.001
    ca1: 0.0007
    ca2: 0.005
    cl0: 0.0
    cl1: 0.0005
    cl2: 0.0013

# Planning parameters
planning_cycle_time: 0.05           # Planning frequency (20 Hz)
checking_time_ratio: 0.6
acc_planning_threshold: 0.1
sampled_trajectories_threshold: 10000
checked_trajectories_threshold: 200
3d_planning: no                     # Use 2D planning
2d_z_margin: 0.5
traveling_cost: "distance"          # "direction" or "distance"
replan_factor: 3.0
debug_num_trajectories: no
collision_probability_threshold: 5
openmp_chunk_size: 16

# Collision checking parameters (adjust based on your drone size)
true_vehicle_radius: 0.25           # Actual radius including propellers (m)
planning_vehicle_radius: 0.45       # Safety margin for planning (m)
minimum_clear_distance: 1.0         # Min clearance from obstacles (m)

# SSTO trajectory generation parameters
depth_upper_bound: 5.0              # Max depth to plan ahead (m)
depth_lower_bound: 1.5              # Min depth to plan ahead (m)
depth_sampling_margin: 0.3
is_spiral_sampling: no
spiral_sampling_step: 3

# Kinematic constraints (adjust based on drone capabilities)
max_velocity_x: 2.0                 # Forward velocity (m/s)
max_velocity_y: 1.0                 # Lateral velocity (m/s)
max_velocity_z: 1.5                 # Vertical velocity (m/s)
max_acceleration_x: 3.0             # Forward acceleration (m/s²)
max_acceleration_y: 2.0             # Lateral acceleration (m/s²)
max_acceleration_z: 2.0             # Vertical acceleration (m/s²)

# Control parameters
trajectory_discretisation_cycle: 0.01  # Control update rate (100 Hz)
go_to_goal_threshold: 2.0              # Distance to switch to goal mode (m)
mavros_control_mode: "kinematic"       # Not used in OmniDrones mode


# MIDI Configuration for Ardupilot/MAVROS
# Runtime mode
runtime_mode: "mavros"
collision_checking_method: "midi"  # MUST be "midi" - PYRAMID method removed (required CUDA)
visualise: no
world_frame_name: "map"
vehicle_frame_name: "base_link"

# Topics
topics:
  depth: "/camera/depth/image_raw"

# Goal coordinates (relative to takeoff position in ENU)
goal_coordinate:
  north: 20.0   # North (meters in ENU Y direction)
  west: 0.0     # West (negative means East, meters in ENU X direction)
  up: 3.0       # Up (meters in ENU Z direction)

# Depth camera parameters (adjust for your camera, e.g., Intel RealSense D435)
depth_camera:
  depth_scale: 0.001  # Convert depth units to meters (RealSense uses mm)
  decimation_factor: 1  # Set to decimation filter value if using
  focal_length: 386.0   # Focal length in pixels (fx or fy)
  cx: 320.0             # Principal point x (image center x)
  cy: 240.0             # Principal point y (image center y)
  depth_uncertainty:
    ca0: 0.001
    ca1: 0.0007
    ca2: 0.005
    cl0: 0.0
    cl1: 0.0005
    cl2: 0.0013

# Planning parameters
planning_cycle_time: 0.05           # Planning frequency (20 Hz)
checking_time_ratio: 0.6
acc_planning_threshold: 0.1
sampled_trajectories_threshold: 10000
checked_trajectories_threshold: 200
3d_planning: no                     # Use 2D planning (safer for initial testing)
2d_z_margin: 0.5
traveling_cost: "distance"          # "direction" or "distance"
replan_factor: 3.0
debug_num_trajectories: no
collision_probability_threshold: 5
openmp_chunk_size: 16

# Collision checking parameters (adjust based on your drone size)
true_vehicle_radius: 0.25           # Actual radius including propellers (m)
planning_vehicle_radius: 0.45       # Safety margin for planning (m)
minimum_clear_distance: 1.0         # Min clearance from obstacles (m)

# SSTO trajectory generation parameters
# Sampling parameters
depth_upper_bound: 5.0              # Max depth to plan ahead (m)
depth_lower_bound: 1.5              # Min depth to plan ahead (m)
depth_sampling_margin: 0.3
is_spiral_sampling: no
spiral_sampling_step: 3

# Kinematic constraints (adjust based on your drone capabilities)
max_velocity_x: 2.0                 # Forward velocity (m/s)
max_velocity_y: 1.0                 # Lateral velocity (m/s)
max_velocity_z: 1.5                 # Vertical velocity (m/s)
max_acceleration_x: 3.0             # Forward acceleration (m/s²)
max_acceleration_y: 2.0             # Lateral acceleration (m/s²)
max_acceleration_z: 2.0             # Vertical acceleration (m/s²)

# Control parameters
trajectory_discretisation_cycle: 0.01  # Control update rate (100 Hz)
go_to_goal_threshold: 2.0              # Distance to switch to goal mode (m)
mavros_control_mode: "kinematic"       # "kinematic" or "attitude"

